<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173d32">
<meta name="description" content="FIFFY360 — il tuo spazio personale per organizzare e prenderti cura di te.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<title>FIFFY360</title>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">F</span><div><strong>FIFFY360</strong><small>IL TUO SPAZIO, A 360°</small></div></div>
    <button class="icon-btn" id="quickAdd" aria-label="Aggiungi"><span>＋</span></button>
  </header>
  <main id="view" class="view" aria-live="polite"></main>
  <nav class="bottom-nav" aria-label="Navigazione principale">
    <button data-tab="home" class="nav-item active"><span>⌂</span><small>Home</small></button>
    <button data-tab="agenda" class="nav-item"><span>▦</span><small>Agenda</small></button>
    <button data-tab="tasks" class="nav-item"><span>✓</span><small>Attività</small></button>
    <button data-tab="care" class="nav-item"><span>♡</span><small>Benessere</small></button>
    <button data-tab="more" class="nav-item"><span>✧</span><small>Altro</small></button>
  </nav>
</div>
<div id="modalRoot"></div>
<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
